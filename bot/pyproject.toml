[project]
name = "bot"
version = "0.1.0"
description = "Learning Management System Telegram Bot"
requires-python = ">=3.12"
dependencies = [
  "aiogram>=3.20",
  "httpx>=0.28.1",
  "pydantic-settings>=2.12.0",
]

[tool.uv.sources]
bot = { workspace = true }

[project.scripts]
bot = "bot.bot:main"

[dependency-groups]
dev = [
  "pytest>=9.0.2",
  "pytest-asyncio>=0.25.0",
  "ruff>=0.14.14",
]

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
